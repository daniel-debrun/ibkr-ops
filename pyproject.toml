[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-ops"
version = "0.1.0"
description = "A hardened, cron-friendly layer on ib_async for Interactive Brokers: order gates, pacing, cron guard, safer defaults"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daniel-debrun" }]
keywords = ["interactive brokers", "ibkr", "ib_async", "ib gateway", "tws", "trading", "cron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# Pinned to the tested ib_async minor version: the session layer relies on RaiseRequestErrors, Trade.log
# and errorEvent semantics.
dependencies = ["ib_async>=2.1,<2.2"]

[project.urls]
Homepage = "https://github.com/daniel-debrun/ibkr-ops"
Documentation = "https://github.com/daniel-debrun/ibkr-ops/tree/main/docs"
Repository = "https://github.com/daniel-debrun/ibkr-ops"
Issues = "https://github.com/daniel-debrun/ibkr-ops/issues"
Changelog = "https://github.com/daniel-debrun/ibkr-ops/blob/main/CHANGELOG.md"

[project.optional-dependencies]
signing = ["PyNaCl>=1.5"]
test = ["pytest>=7", "PyNaCl>=1.5"]

[project.scripts]
ibkr-ops = "ibkr_ops.cli:main"

[tool.setuptools]
packages = ["ibkr_ops"]

[tool.setuptools.package-data]
ibkr_ops = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
